name: Systolic Array Congestion Sweep

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Select experiment size"
        required: true
        type: choice
        default: test_1_run
        options:
          - test_1_run
          - full_72_run

permissions:
  contents: read
  actions: write

jobs:

  # ================================================================
  # JOB 1: Generate Matrix
  # ================================================================
  generate-matrix:

    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:

      - name: Generate experiment matrix
        id: set-matrix
        shell: bash
        env:
          TEST_MODE: ${{ inputs.test_mode }}
        run: |

          set -euo pipefail

          if [ "$TEST_MODE" = "test_1_run" ]; then

            echo "Selected: TEST RUN"

            MATRIX='[
              {
                "array_size": 4,
                "data_width": 8,
                "utilization": 30,
                "clk_period": 5.0
              }
            ]'

          else

            echo "Selected: FULL 72-RUN SWEEP"

            MATRIX=$(jq -cn '
              [4,8,16][] as $array_size |
              [8,16][] as $data_width |
              [20,30,40,50,60,70][] as $utilization |
              [2.0,5.0][] as $clk_period |
              {
                array_size: $array_size,
                data_width: $data_width,
                utilization: $utilization,
                clk_period: $clk_period
              }
            ')

          fi

          COUNT=$(printf '%s' "$MATRIX" | jq length)

          echo "========================================"
          echo "EXPERIMENT MATRIX"
          echo "========================================"
          echo "Number of configurations: $COUNT"
          echo "========================================"

          if [ "$TEST_MODE" = "full_72_run" ] && [ "$COUNT" -ne 72 ]; then
            echo "ERROR: Expected exactly 72 configurations."
            exit 1
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"


  # ================================================================
  # JOB 2: Run Sweep
  # ================================================================
  run-sweep:

    needs: generate-matrix

    runs-on: ubuntu-latest

    timeout-minutes: 90

    strategy:
      fail-fast: false
      max-parallel: 16

      matrix:
        include: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}

    steps:

      # --------------------------------------------------------------
      # Checkout
      # --------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------------
      # Cache
      # --------------------------------------------------------------
      - name: Cache Conda Toolchain
        id: cache-conda
        uses: actions/cache@v4
        with:
          path: ./conda-env
          key: ${{ runner.os }}-condapdk-v6-fmt8


      # --------------------------------------------------------------
      # Disk cleanup
      # --------------------------------------------------------------
      - name: Free up disk space
        if: steps.cache-conda.outputs.cache-hit != 'true'
        shell: bash
        run: |

          set -euo pipefail

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          sudo apt-get clean


      # --------------------------------------------------------------
      # Install OpenROAD / Yosys / SKY130
      # --------------------------------------------------------------
      - name: Install toolchain
        if: steps.cache-conda.outputs.cache-hit != 'true'
        timeout-minutes: 40
        shell: bash
        run: |

          set -euo pipefail

          curl -Ls \
            https://micro.mamba.pm/api/micromamba/linux-64/latest \
            | tar -xvj bin/micromamba

          ./bin/micromamba create \
            --yes \
            --prefix ./conda-env \
            --channel https://conda.anaconda.org/litex-hub \
            --channel conda-forge \
            --channel main \
            open_pdks.sky130a \
            openroad \
            yosys \
            fmt=8


      # --------------------------------------------------------------
      # PATH
      # --------------------------------------------------------------
      - name: Add toolchain to PATH
        shell: bash
        run: |

          set -euo pipefail

          echo "$(pwd)/conda-env/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/conda-env/lib" >> "$GITHUB_PATH"

          echo "LD_LIBRARY_PATH=$(pwd)/conda-env/lib:${LD_LIBRARY_PATH:-}" \
            >> "$GITHUB_ENV"


      # --------------------------------------------------------------
      # Experiment variables
      # --------------------------------------------------------------
      - name: Set run environment
        shell: bash
        run: |

          set -euo pipefail

          echo "ARRAY_SIZE=${{ matrix.array_size }}" >> "$GITHUB_ENV"
          echo "DATA_WIDTH=${{ matrix.data_width }}" >> "$GITHUB_ENV"
          echo "UTIL=${{ matrix.utilization }}" >> "$GITHUB_ENV"
          echo "CLK_PERIOD=${{ matrix.clk_period }}" >> "$GITHUB_ENV"

          echo "RUN_TAG=sys${{ matrix.array_size }}_w${{ matrix.data_width }}_u${{ matrix.utilization }}_clk${{ matrix.clk_period }}" \
            >> "$GITHUB_ENV"


      # --------------------------------------------------------------
      # Find SKY130 Liberty
      # --------------------------------------------------------------
      - name: Locate SKY130 Liberty
        shell: bash
        run: |

          set -euo pipefail

          echo "Searching for SKY130 Liberty file..."

          LIB=$(find ./conda-env -type f \
            \( \
              -name "sky130_fd_sc_hd__tt_025C_5v00.lib" \
              -o -name "sky130_fd_sc_hd__tt_025C_5v00.lib.gz" \
              -o -name "sky130_fd_sc_hd*.lib" \
              -o -name "sky130_fd_sc_hd*.lib.gz" \
            \) \
            -print | head -n 1)

          if [ -z "$LIB" ]; then

            echo "ERROR: SKY130 Liberty file not found."

            echo "Available SKY130 files:"

            find ./conda-env -type f \
              | grep -i sky130 \
              | head -100 || true

            exit 1
          fi

          echo "Found Liberty:"
          echo "$LIB"

          if [[ "$LIB" == *.lib.gz ]]; then

            echo "Liberty is compressed."
            echo "Decompressing..."

            gunzip -k "$LIB"

            LIB="${LIB%.gz}"
          fi

          test -f "$LIB"

          echo "Using Liberty:"
          echo "$LIB"

          echo "LIB_FILE=$LIB" >> "$GITHUB_ENV"


      # --------------------------------------------------------------
      # Verify toolchain
      # --------------------------------------------------------------
      - name: Verify toolchain
        shell: bash
        run: |

          set -euo pipefail

          echo "======================================"
          echo "ARRAY_SIZE = $ARRAY_SIZE"
          echo "DATA_WIDTH = $DATA_WIDTH"
          echo "UTIL       = $UTIL"
          echo "CLK_PERIOD = $CLK_PERIOD"
          echo "RUN_TAG    = $RUN_TAG"
          echo "LIB_FILE   = $LIB_FILE"
          echo "======================================"

          command -v yosys
          command -v openroad

          yosys -V
          openroad -version

          test -f "$LIB_FILE"


      # ================================================================
      # SYNTHESIS
      # ================================================================
      - name: Synthesize
        timeout-minutes: 10
        shell: bash
        run: |

          set -euo pipefail

          mkdir -p \
            "systolic_project/synth"

          mkdir -p \
            "systolic_project/runs/${RUN_TAG}"

          sed \
            -e "s|__ARRAY_SIZE__|${ARRAY_SIZE}|g" \
            -e "s|__DATA_WIDTH__|${DATA_WIDTH}|g" \
            -e "s|__LIB_FILE__|${LIB_FILE}|g" \
            -e "s|__RUN_TAG__|${RUN_TAG}|g" \
            scripts/synth.ys \
            > /tmp/synth.ys

          echo "Running Yosys..."

          yosys \
            -s /tmp/synth.ys \
            2>&1 | tee \
            "systolic_project/runs/${RUN_TAG}/synth_log.txt"

          test -f \
            "systolic_project/synth/systolic_netlist.v"


      # ================================================================
      # OPENROAD
      # ================================================================
      - name: Run OpenROAD
        timeout-minutes: 30
        shell: bash
        run: |

          set -euo pipefail

          RUN_DIR="systolic_project/runs/${RUN_TAG}"

          openroad \
            -exit \
            scripts/flow.tcl \
            2>&1 | tee \
            "${RUN_DIR}/openroad_log.txt"

          test -f \
            "${RUN_DIR}/final.odb"


      # ================================================================
      # DEBUG GENERATED REPORTS
      # ================================================================
      - name: Inspect generated reports
        shell: bash
        run: |

          set -euo pipefail

          RUN_DIR="systolic_project/runs/${RUN_TAG}"

          echo "=================================================="
          echo "RUN DIRECTORY"
          echo "=================================================="

          find "$RUN_DIR" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort


          echo
          echo "=================================================="
          echo "FILE SIZES"
          echo "=================================================="

          find "$RUN_DIR" \
            -maxdepth 1 \
            -type f \
            -printf '%s bytes  %f\n' \
            | sort


          REPORTS="
          design_area.rpt
          placement_area.rpt
          cell_usage.rpt
          wirelength_global.rpt
          wirelength_detailed.rpt
          wirelength_final.rpt
          congestion.rpt
          route_status_final.rpt
          timing_setup.rpt
          timing_hold.rpt
          wns_setup.rpt
          tns_setup.rpt
          wns_hold.rpt
          tns_hold.rpt
          "


          for FILE in $REPORTS
          do

            echo
            echo "=================================================="
            echo "REPORT: $FILE"
            echo "=================================================="

            if [ -f "$RUN_DIR/$FILE" ]; then

              cat "$RUN_DIR/$FILE"

            else

              echo "FILE NOT FOUND"

            fi

          done


          echo
          echo "=================================================="
          echo "OPENROAD LOG - LAST 150 LINES"
          echo "=================================================="

          if [ -f "${RUN_DIR}/openroad_log.txt" ]; then

            tail -150 \
              "${RUN_DIR}/openroad_log.txt"

          else

            echo "openroad_log.txt NOT FOUND"

          fi


      # ================================================================
      # FEATURE EXTRACTION
      # ================================================================
      - name: Extract 17 features
        if: success()
        shell: bash
        run: |

          set -euo pipefail

          python3 scripts/extract_features.py

          test -f \
            "systolic_project/runs/${RUN_TAG}/features.json"


      # ================================================================
      # SHOW FEATURES
      # ================================================================
      - name: Show extracted features
        shell: bash
        run: |

          set -euo pipefail

          echo "========================================"
          echo "FEATURES.JSON"
          echo "========================================"

          cat \
            "systolic_project/runs/${RUN_TAG}/features.json"


      # ================================================================
      # UPLOAD
      # ================================================================
      - name: Upload run results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ env.RUN_TAG }}
          path: |
            systolic_project/runs/${{ env.RUN_TAG }}/
            systolic_project/synth/systolic_netlist.v
          if-no-files-found: warn


      # ================================================================
      # SUMMARY
      # ================================================================
      - name: Run summary
        if: always()
        shell: bash
        run: |

          echo "### Run Summary: ${RUN_TAG}" \
            >> "$GITHUB_STEP_SUMMARY"


          if [ -f \
            "systolic_project/runs/${RUN_TAG}/final.odb"
          ]; then

            echo "- final.odb: YES" \
              >> "$GITHUB_STEP_SUMMARY"

          else

            echo "- final.odb: NO" \
              >> "$GITHUB_STEP_SUMMARY"

          fi


          if [ -f \
            "systolic_project/runs/${RUN_TAG}/features.json"
          ]; then

            echo "- 17-feature JSON: YES" \
              >> "$GITHUB_STEP_SUMMARY"

          else

            echo "- 17-feature JSON: NO" \
              >> "$GITHUB_STEP_SUMMARY"

          fi


  # ================================================================
  # JOB 3: Aggregate
  # ================================================================
  aggregate-results:

    needs: run-sweep

    runs-on: ubuntu-latest

    if: always()

    steps:

      # --------------------------------------------------------------
      # Checkout
      # --------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------------
      # Python
      # --------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # --------------------------------------------------------------
      # Dependencies
      # --------------------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |

          set -euo pipefail

          python -m pip install --upgrade pip

          pip install pandas


      # --------------------------------------------------------------
      # Download artifacts
      # --------------------------------------------------------------
      - name: Download all result artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_artifacts
          merge-multiple: true


      # --------------------------------------------------------------
      # Show downloaded files
      # --------------------------------------------------------------
      - name: Show downloaded files
        shell: bash
        run: |

          echo "Downloaded files:"

          find downloaded_artifacts \
            -type f \
            -print \
            | sort


      # --------------------------------------------------------------
      # Aggregate JSON
      # --------------------------------------------------------------
      - name: Combine JSON features into CSV
        shell: bash
        run: |

          set -euo pipefail

          mkdir -p summary_output

          python3 scripts/aggregate_dataset.py \
            --runs_dir downloaded_artifacts \
            --output_csv \
            summary_output/systolic_array_sweep_dataset.csv


      # --------------------------------------------------------------
      # Verify CSV
      # --------------------------------------------------------------
      - name: Verify CSV
        shell: bash
        run: |

          set -euo pipefail

          CSV="summary_output/systolic_array_sweep_dataset.csv"

          test -f "$CSV"

          echo "Dataset:"
          echo "--------------------------------"

          head -n 5 "$CSV"

          echo "--------------------------------"

          ROWS=$(tail -n +2 "$CSV" | wc -l)

          echo "Rows generated: $ROWS"


      # --------------------------------------------------------------
      # Upload CSV
      # --------------------------------------------------------------
      - name: Upload Aggregated CSV Dataset
        uses: actions/upload-artifact@v4
        with:
          name: full-sweep-dataset-csv
          path: summary_output/systolic_array_sweep_dataset.csv
          if-no-files-found: error


      # --------------------------------------------------------------
      # Aggregate summary
      # --------------------------------------------------------------
      - name: Aggregate summary
        if: always()
        shell: bash
        run: |

          echo "### Aggregate Dataset Summary" \
            >> "$GITHUB_STEP_SUMMARY"

          CSV="summary_output/systolic_array_sweep_dataset.csv"

          if [ -f "$CSV" ]; then

            COUNT=$(tail -n +2 "$CSV" | wc -l)

            echo "- Dataset generated: YES" \
              >> "$GITHUB_STEP_SUMMARY"

            echo "- Run entries: $COUNT" \
              >> "$GITHUB_STEP_SUMMARY"

            echo "- Expected full sweep: 72" \
              >> "$GITHUB_STEP_SUMMARY"

          else

            echo "- Dataset generated: NO" \
              >> "$GITHUB_STEP_SUMMARY"

          fi
