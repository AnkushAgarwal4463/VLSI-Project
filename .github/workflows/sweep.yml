  # ================================================================
  # JOB 2: Run Sweep
  # ================================================================
  run-sweep:

    needs: generate-matrix

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}

    env:
      ARRAY_SIZE: ${{ matrix.array_size }}
      DATA_WIDTH: ${{ matrix.data_width }}
      UTIL: ${{ matrix.utilization }}
      CLK_PERIOD: ${{ matrix.clk_period }}
      RUN_TAG: sys${{ matrix.array_size }}_w${{ matrix.data_width }}_u${{ matrix.utilization }}_clk${{ matrix.clk_period }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: condapdk
          init-shell: bash
          cache-environment: true
          cache-environment-key: condapdk-v4-diskfix
          create-args: >-
            python=3.10
            pip
          post-cleanup: all


      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pandas


      - name: Install PDK and OpenROAD
        shell: bash
        run: |

          set -euo pipefail

          if [ ! -d "$HOME/micromamba/envs/condapdk/share/pdk/sky130A" ]; then
            micromamba install \
              -n condapdk \
              -c litex-hub \
              openroad=2.0_2024.12.31 \
              sky130=0.0.2
          fi

          echo "$HOME/micromamba/envs/condapdk/bin" >> "$GITHUB_PATH"


      - name: Show tool versions
        shell: bash
        run: |

          set -euo pipefail

          which openroad
          openroad -version

          echo
          echo "PDK:"
          ls -la "$HOME/micromamba/envs/condapdk/share/pdk/sky130A"


      - name: Prepare directories
        shell: bash
        run: |

          set -euo pipefail

          mkdir -p \
            systolic_project/runs/${RUN_TAG} \
            systolic_project/synth


      - name: Generate systolic array
        shell: bash
        run: |

          set -euo pipefail

          python3 systolic_project/generate_systolic.py \
            --array-size "${ARRAY_SIZE}" \
            --data-width "${DATA_WIDTH}" \
            --output-dir systolic_project/synth


      - name: Synthesis
        shell: bash
        run: |

          set -euo pipefail

          cd systolic_project/synth

          yosys \
            -p "read_verilog systolic_array.v; \
                synth -top systolic_array; \
                write_verilog systolic_netlist.v" \
            2>&1 | tee ../runs/${RUN_TAG}/synth_log.txt


      - name: Run OpenROAD
        shell: bash
        run: |

          set -euo pipefail

          export PDK_ROOT="$HOME/micromamba/envs/condapdk/share/pdk"
          export PDK=sky130A

          openroad \
            scripts/openroad_flow.tcl \
            2>&1 | tee \
            "systolic_project/runs/${RUN_TAG}/openroad_log.txt"


      - name: Check OpenROAD outputs
        if: always()
        shell: bash
        run: |

          echo "=============================================================="
          echo "OPENROAD OUTPUT CHECK"
          echo "=============================================================="

          RUN_DIR="systolic_project/runs/${RUN_TAG}"

          find "$RUN_DIR" \
            -maxdepth 1 \
            -type f \
            -printf "%f %s bytes\n" \
            | sort

          echo
          echo "Required artifacts:"

          for f in \
            final.def \
            final.odb \
            timing_setup.rpt \
            timing_hold.rpt
          do
            if [ -f "$RUN_DIR/$f" ]; then
              echo "  [OK] $f"
            else
              echo "  [MISSING] $f"
            fi
          done


      - name: Diagnose routing artifacts
        if: always()
        shell: bash
        run: |

          echo "=============================================================="
          echo "ROUTING ARTIFACT DIAGNOSTIC"
          echo "=============================================================="

          RUN_DIR="systolic_project/runs/${RUN_TAG}"

          echo
          echo "Routing files:"
          find "$RUN_DIR" \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*.rpt" \
              -o -name "*.def" \
              -o -name "*.odb" \
              -o -name "*.guide" \
            \) \
            -printf "%f %s bytes\n" \
            | sort

          echo
          echo "Checking final.def..."

          if [ -f "$RUN_DIR/final.def" ]; then

            echo "ROUTED statements:"
            grep -c "ROUTED" "$RUN_DIR/final.def" || true

            echo "FIXED statements:"
            grep -c "FIXED" "$RUN_DIR/final.def" || true

            echo
            echo "First routed/fixed statement:"
            grep -m 1 -E "ROUTED|FIXED" \
              "$RUN_DIR/final.def" || true

          else

            echo "final.def not found."

          fi

          echo
          echo "Checking congestion report..."

          if [ -f "$RUN_DIR/congestion.rpt" ]; then
            wc -c "$RUN_DIR/congestion.rpt"
            cat "$RUN_DIR/congestion.rpt"
          else
            echo "congestion.rpt not found."
          fi


      - name: Extract 17 features
        if: success()
        shell: bash
        run: |

          set -euo pipefail

          python3 scripts/extract_features.py

          test -f \
            "systolic_project/runs/${RUN_TAG}/features.json"


      # ================================================================
      # UPLOAD
      # ================================================================
      - name: Upload run results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ env.RUN_TAG }}
          path: |
            systolic_project/runs/${{ env.RUN_TAG }}/
            systolic_project/synth/systolic_netlist.v
          if-no-files-found: warn


      # ================================================================
      # SUMMARY
      # ================================================================
      - name: Run summary
        if: always()
        shell: bash
        run: |

          echo "### Run Summary: ${RUN_TAG}" \
            >> "$GITHUB_STEP_SUMMARY"

          if [ -f \
            "systolic_project/runs/${RUN_TAG}/final.odb"
          ]; then
            echo "- final.odb: YES" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- final.odb: NO" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f \
            "systolic_project/runs/${RUN_TAG}/features.json"
          ]; then
            echo "- 17-feature JSON: YES" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 17-feature JSON: NO" \
              >> "$GITHUB_STEP_SUMMARY"
          fi


  # ================================================================
  # JOB 3: Aggregate
  # ================================================================
  aggregate-results:

    needs: run-sweep

    runs-on: ubuntu-latest

    if: always()

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pandas


      - name: Download all result artifacts
        uses: actions/download-artifact@v4
        with:
          path: systolic_project/runs
          merge-multiple: true


      - name: Show downloaded files
        shell: bash
        run: |

          echo "Downloaded files:"
          find systolic_project/runs \
            -type f \
            -print \
            | sort


      - name: Verify feature files
        shell: bash
        run: |

          set -euo pipefail

          echo "Searching for feature JSON files..."

          find systolic_project/runs \
            -type f \
            \( -name "features.json" -o -name "*_features.json" \) \
            -print \
            | sort

          COUNT=$(find systolic_project/runs \
            -type f \
            \( -name "features.json" -o -name "*_features.json" \) \
            | wc -l)

          echo
          echo "Feature JSON count: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No feature JSON files found."
            exit 1
          fi


      - name: Combine JSON features into CSV
        shell: bash
        run: |

          set -euo pipefail

          /usr/bin/mkdir -p \
            systolic_project/summary_output

          python3 scripts/aggregate_dataset.py


      - name: Verify CSV
        shell: bash
        run: |

          set -euo pipefail

          CSV="systolic_project/summary_output/dataset.csv"

          test -f "$CSV"

          echo "Dataset:"
          echo "--------------------------------"

          head -n 5 "$CSV"

          echo "--------------------------------"

          ROWS=$(tail -n +2 "$CSV" | wc -l)

          echo "Rows generated: $ROWS"

          if [ "$ROWS" -eq 0 ]; then
            echo "ERROR: Dataset contains zero rows."
            exit 1
          fi


      - name: Verify 19-column schema
        shell: bash
        run: |

          set -euo pipefail

          CSV="systolic_project/summary_output/dataset.csv"

          EXPECTED="array_size,data_width,utilization,clock_period,max_density,mean_density,std_density,pin_density,avg_fanout,max_fanout,x_spread,y_spread,num_registers,logic_depth,crit_path_wirelength,estimated_wirelength,congestion,WNS,TNS"

          echo "Actual header:"
          head -n 1 "$CSV" | cat -A

          echo
          echo "Expected header:"
          echo "$EXPECTED"

          echo
          echo "Checking CSV schema..."

          ACTUAL=$(python3 -c '
          import sys
          from pathlib import Path
          
          csv_file = Path(sys.argv[1])
          
          with csv_file.open("r", encoding="utf-8-sig", newline="") as f:
              header = f.readline().strip().replace("\r", "")
          
          print(header)
          ' "$CSV")

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo
            echo "ERROR: CSV does not contain the expected 19 columns."
            echo
            echo "Actual normalized header:"
            printf '%s\n' "$ACTUAL"
            echo
            echo "Expected header:"
            printf '%s\n' "$EXPECTED"
            exit 1
          fi

          echo
          echo "19-column schema verified successfully."
