name: OpenROAD Parameter Sweep Matrix

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    container:
      image: openroad/flow-scripts:latest
      
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        array_size: [4, 8, 16]
        width: [8, 16]
        utilization: [20, 30, 40, 50, 60, 70]
        clock: [2.0, 5.0]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run OpenROAD Flow
        run: |
          RUN_ID="a${{ matrix.array_size }}_w${{ matrix.width }}_u${{ matrix.utilization }}_c${{ matrix.clock }}"
          RUN_DIR="runs/${RUN_ID}"
          mkdir -p ${RUN_DIR}

          # Execute ORFS with explicit environment parameters and site fix
          make \
            DESIGN_CONFIG=config.mk \
            WORK_DIR=${RUN_DIR} \
            PLACE_SITE="FreePDK45_38x28_100_500" \
            CORE_UTILIZATION=${{ matrix.utilization }} \
            CLOCK_PERIOD=${{ matrix.clock }} \
            VERILOG_INCLUDE_DIRS="." \
            VERILOG_DEFINES="ARRAY_SIZE=${{ matrix.array_size }} DATA_WIDTH=${{ matrix.width }}"

      - name: Upload Logs & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-a${{ matrix.array_size }}-w${{ matrix.width }}-u${{ matrix.utilization }}-c${{ matrix.clock }}
          path: runs/a${{ matrix.array_size }}_w${{ matrix.width }}_u${{ matrix.utilization }}_c${{ matrix.clock }}/
