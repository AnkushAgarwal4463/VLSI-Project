name: Systolic Array Matrix Optimization Sweep

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        array_size: [4, 8, 16]
        data_width: [8, 16]
        util: [30, 50, 70]
        clk_period: [5, 10, 15, 20]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      # 1. Install Yosys via apt (available natively)
      - name: Install Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys

      # 2. Setup OpenROAD using official GitHub Action
      - name: Setup OpenROAD
        uses: PrecisionInnovations/setup-openroad@v1
        with:
          version: 'latest'

      - name: Execute Matrix Run
        env:
          ARRAY_SIZE: ${{ matrix.array_size }}
          DATA_WIDTH: ${{ matrix.data_width }}
          UTIL: ${{ matrix.util }}
          CLK_PERIOD: ${{ matrix.clk_period }}
          RUN_TAG: "a${{ matrix.array_size }}_w${{ matrix.data_width }}_u${{ matrix.util }}_c${{ matrix.clk_period }}"
        run: |
          RUN_DIR="systolic_project/runs/${RUN_TAG}"
          mkdir -p "${RUN_DIR}"
          echo "RUN_DIR=${RUN_DIR}" >> $GITHUB_ENV

          # Substitute dynamic parameters into Yosys script
          sed -e "s/__ARRAY_SIZE__/${ARRAY_SIZE}/g" \
              -e "s/__DATA_WIDTH__/${DATA_WIDTH}/g" \
              scripts/synth.ys > "${RUN_DIR}/synth_gen.ys"

          # 1. Synthesize with Yosys
          yosys -s "${RUN_DIR}/synth_gen.ys" > "${RUN_DIR}/yosys.log" 2>&1

          # 2. Place & Route with OpenROAD
          openroad -exit scripts/flow.tcl > "${RUN_DIR}/openroad.log" 2>&1

          # 3. Extract Features
          python3 scripts/extract_features.py

      - name: Upload Run Feature JSON
        uses: actions/upload-artifact@v4
        with:
          name: features-${{ matrix.array_size }}-${{ matrix.data_width }}-${{ matrix.util }}-${{ matrix.clk_period }}
          path: systolic_project/runs/*/*_features.json

  aggregate-results:
    needs: run-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas

      - name: Download All Feature Artifacts
        uses: actions/download-artifact@v4
        with:
          path: systolic_project/runs
          pattern: features-*
          merge-multiple: true

      - name: Aggregate Dataset into CSV
        run: python3 scripts/aggregate_dataset.py

      - name: Upload Final Aggregated Dataset CSV
        uses: actions/upload-artifact@v4
        with:
          name: placement_dataset_real.csv
          path: dataset/placement_dataset_real.csv
