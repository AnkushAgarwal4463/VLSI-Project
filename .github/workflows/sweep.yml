name: OpenROAD Single Smoke Test

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    container:
      image: openroad/orfs:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Single Test Job (Direct OpenROAD Tcl Driver)
        run: |
          mkdir -p runs/smoke_test
          openroad -exit scripts/flow.tcl \
            -metrics runs/smoke_test/metrics.json

      - name: Upload Smoke Test Logs & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: runs/smoke_test/
