name: OpenROAD 72-Run Matrix Optimization Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        array_size: [4, 8, 16]
        data_width: [8, 16]
        util: [30, 50, 70]
        clk: [5.0, 10.0, 15.0, 20.0]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Conda Environment & OpenROAD
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          python-version: "3.10"
          activate-environment: test
          environment-file: environment.yml

      - name: Execute Physical Design Flow
        env:
          RUN_TAG: "run_a${{ matrix.array_size }}_w${{ matrix.data_width }}_u${{ matrix.util }}_c${{ matrix.clk }}"
          ARRAY_SIZE: "${{ matrix.array_size }}"
          DATA_WIDTH: "${{ matrix.data_width }}"
          UTIL: "${{ matrix.util }}"
          CLK_PERIOD: "${{ matrix.clk }}"
        run: |
          mkdir -p systolic_project/runs/$RUN_TAG
          openroad -exit scripts/flow.tcl > systolic_project/runs/$RUN_TAG/openroad.log 2>&1 || true

      - name: Extract Matrix Features
        env:
          RUN_DIR: "systolic_project/runs/run_a${{ matrix.array_size }}_w${{ matrix.data_width }}_u${{ matrix.util }}_c${{ matrix.clk }}"
          RUN_TAG: "run_a${{ matrix.array_size }}_w${{ matrix.data_width }}_u${{ matrix.util }}_c${{ matrix.clk }}"
          ARRAY_SIZE: "${{ matrix.array_size }}"
          DATA_WIDTH: "${{ matrix.data_width }}"
          UTIL: "${{ matrix.util }}"
          CLK_PERIOD: "${{ matrix.clk }}"
        run: |
          python3 extract_features.py

      - name: Upload Single Run Artifact
        uses: actions/upload-artifact@v3
        with:
          name: features-run_a${{ matrix.array_size }}_w${{ matrix.data_width }}_u${{ matrix.util }}_c${{ matrix.clk }}
          path: systolic_project/runs/run_a${{ matrix.array_size }}_w${{ matrix.data_width }}_u${{ matrix.util }}_c${{ matrix.clk }}/*_features.json

  aggregate-results:
    needs: run-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install pandas

      - name: Download All Artifacts
        uses: actions/download-artifact@v3
        with:
          path: systolic_project/runs

      - name: Aggregate CSV Dataset
        run: |
          python3 aggregate_dataset.py

      - name: Upload Aggregated Dataset
        uses: actions/upload-artifact@v3
        with:
          name: placement_dataset_real
          path: dataset/placement_dataset_real.csv
