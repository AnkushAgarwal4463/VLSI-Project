  # ================================================================
  # JOB 2: Run Sweep
  # ================================================================
  run-sweep:

    needs: generate-matrix

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}

    env:
      ARRAY_SIZE: ${{ matrix.array_size }}
      DATA_WIDTH: ${{ matrix.data_width }}
      UTIL: ${{ matrix.utilization }}
      CLK_PERIOD: ${{ matrix.clk_period }}
      RUN_TAG: sys${{ matrix.array_size }}_w${{ matrix.data_width }}_u${{ matrix.utilization }}_clk${{ matrix.clk_period }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: condapdk
          init-shell: bash
          cache-environment: true
          cache-environment-key: condapdk-v4-diskfix
          create-args: >-
            python=3.10
            pip
          post-cleanup: all


      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pandas


      - name: Install PDK and OpenROAD
        shell: bash
        run: |

          set -euo pipefail

          if [ ! -d "$HOME/micromamba/envs/condapdk/share/pdk/sky130A" ]; then
            micromamba install \
              -n condapdk \
              -c litex-hub \
              openroad=2.0_2024.12.31 \
              sky130=0.0.2
          fi

          echo "$HOME/micromamba/envs/condapdk/bin" >> "$GITHUB_PATH"


      - name: Show tool versions
        shell: bash
        run: |

          set -euo pipefail

          which openroad
          openroad -version

          echo
          echo "PDK:"
          ls -la "$HOME/micromamba/envs/condapdk/share/pdk/sky130A"


      - name: Prepare directories
        shell: bash
        run: |

          set -euo pipefail

          mkdir -p \
            systolic_project/runs/${RUN_TAG} \
            systolic_project/synth


      - name: Generate systolic array
        shell: bash
        run: |

          set -euo pipefail

          python3 systolic_project/generate_systolic.py \
            --array-size "${ARRAY_SIZE}" \
            --data-width "${DATA_WIDTH}" \
            --output-dir systolic_project/synth


      - name: Synthesis
        shell: bash
        run: |

          set -euo pipefail

          cd systolic_project/synth

          yosys \
            -p "read_verilog systolic_array.v; \
                synth -top systolic_array; \
                write_verilog systolic_netlist.v" \
            2>&1 | tee ../runs/${RUN_TAG}/synth_log.txt


      - name: Run OpenROAD
        shell: bash
        run: |

          set -euo pipefail

          export PDK_ROOT="$HOME/micromamba/envs/condapdk/share/pdk"
          export PDK=sky130A

          openroad \
            scripts/openroad_flow.tcl \
            2>&1 | tee \
            "systolic_project/runs/${RUN_TAG}/openroad_log.txt"


      - name: Check OpenROAD outputs
        if: always()
        shell: bash
        run: |

          echo "=============================================================="
          echo "OPENROAD OUTPUT CHECK"
          echo "=============================================================="

          RUN_DIR="systolic_project/runs/${RUN_TAG}"

          find "$RUN_DIR" \
            -maxdepth 1 \
            -type f \
            -printf "%f %s bytes\n" \
            | sort

          echo
          echo "Required artifacts:"

          for f in \
            final.def \
            final.odb \
            timing_setup.rpt \
            timing_hold.rpt
          do
            if [ -f "$RUN_DIR/$f" ]; then
              echo "  [OK] $f"
            else
              echo "  [MISSING] $f"
            fi
          done


      - name: Diagnose routing artifacts
        if: always()
        shell: bash
        run: |

          echo "=============================================================="
          echo "ROUTING ARTIFACT DIAGNOSTIC"
          echo "=============================================================="

          RUN_DIR="systolic_project/runs/${RUN_TAG}"

          echo
          echo "Routing files:"
          find "$RUN_DIR" \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*.rpt" \
              -o -name "*.def" \
              -o -name "*.odb" \
              -o -name "*.guide" \
            \) \
            -printf "%f %s bytes\n" \
            | sort

          echo
          echo "Checking final.def..."

          if [ -f "$RUN_DIR/final.def" ]; then

            echo "ROUTED statements:"
            grep -c "ROUTED" "$RUN_DIR/final.def" || true

            echo "FIXED statements:"
            grep -c "FIXED" "$RUN_DIR/final.def" || true

            echo
            echo "First routed/fixed statement:"
            grep -m 1 -E "ROUTED|FIXED" \
              "$RUN_DIR/final.def" || true

          else

            echo "final.def not found."

          fi

          echo
          echo "Checking congestion report..."

          if [ -f "$RUN_DIR/congestion.rpt" ]; then
            wc -c "$RUN_DIR/congestion.rpt"
            cat "$RUN_DIR/congestion.rpt"
          else
            echo "congestion.rpt not found."
          fi


      - name: Extract 17 features
        if: success()
        shell: bash
        run: |

          set -euo pipefail

          python3 scripts/extract_features.py

          test -f \
            "systolic_project/runs/${RUN_TAG}/features.json"


      # ================================================================
      # UPLOAD
      # ================================================================
      - name: Upload run results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ env.RUN_TAG }}
          path: |
            systolic_project/runs/${{ env.RUN_TAG }}/
            systolic_project/synth/systolic_netlist.v
          if-no-files-found: warn


      # ================================================================
      # SUMMARY
      # ================================================================
      - name: Run summary
        if: always()
        shell: bash
        run: |

          echo "### Run Summary: ${RUN_TAG}" \
            >> "$GITHUB_STEP_SUMMARY"

          if [ -f \
            "systolic_project/runs/${RUN_TAG}/final.odb"
          ]; then
            echo "- final.odb: YES" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- final.odb: NO" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f \
            "systolic_project/runs/${RUN_TAG}/features.json"
          ]; then
            echo "- 17-feature JSON: YES" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 17-feature JSON: NO" \
              >> "$GITHUB_STEP_SUMMARY"
          fi


   # ================================================================
  # JOB 3: Aggregate Results
  # ================================================================
  aggregate-results:

    needs: run-sweep

    runs-on: ubuntu-latest

    if: always()

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------------
      # Python
      # --------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # --------------------------------------------------------------
      # Dependencies
      # --------------------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install pandas


      # --------------------------------------------------------------
      # Download ALL run artifacts
      # --------------------------------------------------------------
      - name: Download all result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: downloaded_results
          merge-multiple: true


      # --------------------------------------------------------------
      # Show downloaded structure
      # --------------------------------------------------------------
      - name: Inspect downloaded artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "DOWNLOADED ARTIFACTS"
          echo "=============================================================="

          if [ ! -d "downloaded_results" ]; then
            echo "ERROR: downloaded_results directory does not exist."
            exit 1
          fi

          find downloaded_results \
            -type f \
            -printf '%p %s bytes\n' \
            | sort

          echo
          echo "=============================================================="
          echo "FEATURE JSON FILES"
          echo "=============================================================="

          find downloaded_results \
            -type f \
            -name "features.json" \
            -print \
            | sort


      # --------------------------------------------------------------
      # Build CSV directly from features.json files
      # --------------------------------------------------------------
      - name: Generate dataset CSV
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p systolic_project/summary_output

          python3 <<'PY'
          import json
          import csv
          from pathlib import Path

          ROOT = Path("downloaded_results")
          OUTPUT = Path("systolic_project/summary_output/dataset.csv")

          EXPECTED = [
              "array_size",
              "data_width",
              "utilization",
              "clock_period",
              "max_density",
              "mean_density",
              "std_density",
              "pin_density",
              "avg_fanout",
              "max_fanout",
              "x_spread",
              "y_spread",
              "num_registers",
              "logic_depth",
              "crit_path_wirelength",
              "estimated_wirelength",
              "congestion",
              "WNS",
              "TNS"
          ]

          feature_files = sorted(ROOT.rglob("features.json"))

          print("==============================================================")
          print("FEATURE EXTRACTION FOR DATASET")
          print("==============================================================")
          print(f"Search root : {ROOT}")
          print(f"Feature files found: {len(feature_files)}")
          print()

          if not feature_files:
              print("ERROR: No features.json files were found.")
              print()
              print("Files actually downloaded:")
              for p in sorted(ROOT.rglob("*")):
                  if p.is_file():
                      print("  ", p)
              raise SystemExit(1)

          rows = []

          for feature_file in feature_files:

              print(f"Reading: {feature_file}")

              try:
                  with feature_file.open("r", encoding="utf-8") as f:
                      data = json.load(f)
              except Exception as e:
                  print(f"  WARNING: Could not read JSON: {e}")
                  continue

              # ------------------------------------------------------
              # Support normal flat features.json
              # ------------------------------------------------------
              if not isinstance(data, dict):
                  print("  WARNING: JSON root is not an object.")
                  continue

              row = {}

              for key in EXPECTED:
                  row[key] = data.get(key, None)

              # ------------------------------------------------------
              # Recover experiment parameters from run_tag if needed
              # ------------------------------------------------------
              run_tag = data.get("run_tag")

              if run_tag:
                  import re

                  match = re.search(
                      r"sys(\d+)_w(\d+)_u(\d+)_clk([0-9.]+)",
                      str(run_tag)
                  )

                  if match:
                      if row["array_size"] is None:
                          row["array_size"] = int(match.group(1))

                      if row["data_width"] is None:
                          row["data_width"] = int(match.group(2))

                      if row["utilization"] is None:
                          row["utilization"] = int(match.group(3))

                      if row["clock_period"] is None:
                          row["clock_period"] = float(match.group(4))

              # ------------------------------------------------------
              # Also support alternative parameter names
              # ------------------------------------------------------
              if row["clock_period"] is None:
                  row["clock_period"] = data.get("clk_period")

              if row["utilization"] is None:
                  row["utilization"] = data.get("util")

              # ------------------------------------------------------
              # Add row
              # ------------------------------------------------------
              rows.append(row)

              print("  OK")

          # ----------------------------------------------------------
          # Write CSV
          # ----------------------------------------------------------
          OUTPUT.parent.mkdir(parents=True, exist_ok=True)

          with OUTPUT.open(
              "w",
              encoding="utf-8",
              newline=""
          ) as f:

              writer = csv.DictWriter(
                  f,
                  fieldnames=EXPECTED,
                  extrasaction="ignore"
              )

              writer.writeheader()

              for row in rows:
                  writer.writerow(row)

          print()
          print("==============================================================")
          print("CSV CREATED")
          print("==============================================================")
          print(f"Output : {OUTPUT}")
          print(f"Rows   : {len(rows)}")
          print(f"Columns: {len(EXPECTED)}")
          print()

          print("Header:")
          print(",".join(EXPECTED))

          if len(rows) == 0:
              print("ERROR: CSV contains zero rows.")
              raise SystemExit(1)
          PY


      # --------------------------------------------------------------
      # Verify CSV
      # --------------------------------------------------------------
      - name: Verify CSV
        shell: bash
        run: |
          set -euo pipefail

          CSV="systolic_project/summary_output/dataset.csv"

          echo "=============================================================="
          echo "DATASET VERIFICATION"
          echo "=============================================================="

          test -f "$CSV"

          echo
          echo "CSV location:"
          ls -lh "$CSV"

          echo
          echo "CSV preview:"
          head -n 5 "$CSV"

          echo
          ROWS=$(tail -n +2 "$CSV" | wc -l)

          echo "Rows generated: $ROWS"

          if [ "$ROWS" -eq 0 ]; then
            echo "ERROR: Dataset contains zero rows."
            exit 1
          fi


      # --------------------------------------------------------------
      # Verify 19-column schema
      # --------------------------------------------------------------
      - name: Verify 19-column schema
        shell: bash
        run: |
          set -euo pipefail

          CSV="systolic_project/summary_output/dataset.csv"

          EXPECTED="array_size,data_width,utilization,clock_period,max_density,mean_density,std_density,pin_density,avg_fanout,max_fanout,x_spread,y_spread,num_registers,logic_depth,crit_path_wirelength,estimated_wirelength,congestion,WNS,TNS"

          echo "Actual header:"
          head -n 1 "$CSV" | cat -A

          echo
          echo "Expected header:"
          echo "$EXPECTED"

          echo
          echo "Checking CSV schema..."

          ACTUAL=$(python3 - "$CSV" <<'PY'
          import sys
          from pathlib import Path

