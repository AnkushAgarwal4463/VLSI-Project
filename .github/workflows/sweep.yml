name: Systolic Array Congestion Sweep (72 Runs)

on:
  workflow_dispatch:

jobs:
  run-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 16  # Prevents GitHub API rate limits and balances queue execution
      matrix:
        array_size: [4, 8, 16]
        data_width: [8, 16]
        utilization: [20, 30, 40, 50, 60, 70]
        clk_period: [2.0, 5.0]
        # Total runs: 3 * 2 * 6 * 2 = 72

    steps:
      - uses: actions/checkout@v4

      - name: Cache Conda Toolchain
        id: cache-conda
        uses: actions/cache@v4
        with:
          path: ./conda-env
          key: ${{ runner.os }}-condapdk-v4-diskfix

      - name: Free up disk space before install
        if: steps.cache-conda.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: Install toolchain
        if: steps.cache-conda.outputs.cache-hit != 'true'
        timeout-minutes: 40
        run: |
          set -euo pipefail
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xvj bin/micromamba
          ./bin/micromamba create --yes --prefix ./conda-env \
            --channel litex-hub --channel main \
            open_pdks.sky130a openroad yosys

      - name: Add toolchain to PATH
        run: echo "$(pwd)/conda-env/bin" >> $GITHUB_PATH

      - name: Set run environment
        run: |
          echo "ARRAY_SIZE=${{ matrix.array_size }}" >> $GITHUB_ENV
          echo "DATA_WIDTH=${{ matrix.data_width }}" >> $GITHUB_ENV
          echo "UTIL=${{ matrix.utilization }}" >> $GITHUB_ENV
          echo "CLK_PERIOD=${{ matrix.clk_period }}" >> $GITHUB_ENV
          echo "RUN_TAG=sys${{ matrix.array_size }}_w${{ matrix.data_width }}_u${{ matrix.utilization }}_clk${{ matrix.clk_period }}" >> $GITHUB_ENV

      - name: Synthesize
        timeout-minutes: 10
        run: |
          mkdir -p systolic_project/synth systolic_project/runs
          cp scripts/synth.ys scripts/synth_run.ys
          sed -i "s/__ARRAY_SIZE__/${ARRAY_SIZE}/g" scripts/synth_run.ys
          sed -i "s/__DATA_WIDTH__/${DATA_WIDTH}/g" scripts/synth_run.ys
          yosys -s scripts/synth_run.ys 2>&1 | tee systolic_project/synth/synth_log.txt
          test -f systolic_project/synth/systolic_netlist.v

      - name: Upload synthesis outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synth-outputs-${{ env.RUN_TAG }}
          path: |
            systolic_project/synth/
            scripts/synth_run.ys
          if-no-files-found: ignore

      - name: Run OpenROAD flow
        timeout-minutes: 30
        run: |
          openroad -exit scripts/flow.tcl 2>&1 | tee systolic_project/runs/${RUN_TAG}_log.txt
          test -f systolic_project/runs/${RUN_TAG}/final.odb

      - name: Extract features
        if: success()
        env:
          RUN_DIR: systolic_project/runs/${{ env.RUN_TAG }}
        run: |
          openroad -python scripts/extract_features.py \
            systolic_project/runs/${RUN_TAG}${RUN_TAG} ${UTIL}${CLK_PERIOD} ${ARRAY_SIZE}${DATA_WIDTH} \
            > systolic_project/runs/${RUN_TAG}_features.json

      - name: Upload final results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ env.RUN_TAG }}
          path: |
            systolic_project/runs/${RUN_TAG}_log.txt
            systolic_project/runs/${RUN_TAG}_features.json
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo "### Run Summary for ${{ env.RUN_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "- Netlist produced: $(test -f systolic_project/synth/systolic_netlist.v && echo YES \vert{}\vert{} echo NO)" >> $GITHUB_STEP_SUMMARY
          echo "- final.odb produced: $(test -f systolic_project/runs/${RUN_TAG}/final.odb && echo YES || echo NO)" >> $GITHUB_STEP_SUMMARY
          echo "- Features JSON produced: $(test -f systolic_project/runs/${RUN_TAG}_features.json && echo YES || echo NO)" >> $GITHUB_STEP_SUMMARY

  aggregate-results:
    needs: run-sweep
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas

      - name: Download all result artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_artifacts/

      - name: Combine JSON features into CSV
        run: |
          python3 -c '
          import json, glob, os
          import pandas as pd

          records = []
          for filepath in glob.glob("downloaded_artifacts/result-*/*_features.json"):
              try:
                  with open(filepath, "r") as f:
                      data = json.load(f)
                      records.append(data)
              except Exception as e:
                  print(f"Skipping {filepath}: {e}")

          if records:
              df = pd.DataFrame(records)
              os.makedirs("summary_output", exist_ok=True)
              df.to_csv("summary_output/systolic_array_sweep_dataset.csv", index=False)
              print(f"Successfully aggregated {len(df)} records into systolic_array_sweep_dataset.csv")
          else:
              print("No feature files found to aggregate.")
          '

      - name: Upload Aggregated CSV Dataset
        uses: actions/upload-artifact@v4
        with:
          name: full-sweep-dataset-csv
          path: summary_output/systolic_array_sweep_dataset.csv

      - name: Summary
        run: |
          echo "### Aggregate Dataset Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f summary_output/systolic_array_sweep_dataset.csv ]; then
            COUNT=$(wc -l < summary_output/systolic_array_sweep_dataset.csv)
            echo "Successfully generated \`systolic_array_sweep_dataset.csv\` with $((COUNT-1)) run entries." >> $GITHUB_STEP_SUMMARY
          else
            echo "Failed to generate aggregated CSV dataset." >> $GITHUB_STEP_SUMMARY
          fi
