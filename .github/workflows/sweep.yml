name: OpenROAD Single Smoke Test

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    container:
      image: openroad/flow-scripts:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Single Test Job (Floorplan Verification)
        run: |
          mkdir -p runs/smoke_test
          make DESIGN_CONFIG=config.mk \
            WORK_DIR=runs/smoke_test \
            SITE="FreePDK45_38x28_10R_NP_162NW_34O" \
            CORE_UTILIZATION=50 \
            CLOCK_PERIOD=10.0 \
            VERILOG_DEFINES="ARRAY_SIZE=4 DATA_WIDTH=8"

      - name: Upload Smoke Test Logs & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: runs/smoke_test/
