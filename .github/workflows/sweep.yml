name: Systolic Array Matrix Optimization Sweep

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-matrix:
    runs-on: ubuntu-latest
    container:
      image: openroad/orfs:latest

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        array_size: [4, 8, 16]
        data_width: [8, 16]
        util: [30, 50, 70]
        clk_period: [5, 10, 15, 20]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate PDK & Execute Matrix Run
        env:
          ARRAY_SIZE: ${{ matrix.array_size }}
          DATA_WIDTH: ${{ matrix.data_width }}
          UTIL: ${{ matrix.util }}
          CLK_PERIOD: ${{ matrix.clk_period }}
          RUN_TAG: "a${{ matrix.array_size }}_w${{ matrix.data_width }}_u${{ matrix.util }}_c${{ matrix.clk_period }}"
          PATH: /OpenROAD-flow-scripts/tools/install/OpenROAD/bin:/OpenROAD-flow-scripts/tools/install/yosys/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH
          PYTHONPATH: /OpenROAD-flow-scripts/tools/install/OpenROAD/lib/python:$PYTHONPATH
        run: |
          set -e

          echo "=== Dynamic PDK Resolution ==="
          export LIB_FILE=$(find / -iname "NangateOpenCellLibrary_typical.lib" 2>/dev/null | head -n 1)
          export TECH_LEF_FILE=$(find / -iname "*tech*.lef" 2>/dev/null | grep -i nangate | head -n 1)
          export CELL_LEF_FILE=$(find / -iname "NangateOpenCellLibrary.macro.lef" 2>/dev/null || find / -iname "NangateOpenCellLibrary.lef" 2>/dev/null | head -n 1)

          if [ -z "$LIB_FILE" ]; then
            echo "ERROR: Nangate45 Liberty file not found in container!"
            exit 1
          fi

          echo "PDK LIB  : $LIB_FILE"
          echo "PDK TECH : $TECH_LEF_FILE"
          echo "PDK CELL : $CELL_LEF_FILE"

          export RUN_DIR="systolic_project/runs/${RUN_TAG}"
          mkdir -p "${RUN_DIR}"
          mkdir -p "systolic_project/synth"

          # Substitute dynamic parameters into Yosys script
          sed -e "s/__ARRAY_SIZE__/${ARRAY_SIZE}/g" \
              -e "s/__DATA_WIDTH__/${DATA_WIDTH}/g" \
              scripts/synth.ys > "${RUN_DIR}/synth_gen.ys"

          echo "=== Starting Yosys Synthesis ==="
          yosys -s "${RUN_DIR}/synth_gen.ys" 2>&1 | tee "${RUN_DIR}/yosys.log"

          echo "=== Starting OpenROAD Place & Route ==="
          openroad -exit scripts/flow.tcl 2>&1 | tee "${RUN_DIR}/openroad.log"

          echo "=== Extracting Features ==="
          python3 scripts/extract_features.py

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ matrix.array_size }}-${{ matrix.data_width }}-${{ matrix.util }}-${{ matrix.clk_period }}
          path: |
            systolic_project/runs/*/*.log
            systolic_project/runs/*/synth_gen.ys

      - name: Upload Run Feature JSON
        uses: actions/upload-artifact@v4
        with:
          name: features-${{ matrix.array_size }}-${{ matrix.data_width }}-${{ matrix.util }}-${{ matrix.clk_period }}
          path: systolic_project/runs/*/*_features.json

  aggregate-results:
    needs: run-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas

      - name: Download All Feature Artifacts
        uses: actions/download-artifact@v4
        with:
          path: systolic_project/runs
          pattern: features-*
          merge-multiple: true

      - name: Aggregate Dataset into CSV
        run: |
          mkdir -p dataset
          python3 scripts/aggregate_dataset.py

      - name: Upload Final Aggregated Dataset CSV
        uses: actions/upload-artifact@v4
        with:
          name: placement_dataset_real.csv
          path: dataset/placement_dataset_real.csv
