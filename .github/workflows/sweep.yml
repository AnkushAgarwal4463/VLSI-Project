name: Systolic Array Congestion Sweep

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Select experiment size"
        required: true
        type: choice
        default: test_1_run
        options:
          - test_1_run
          - full_72_run

permissions:
  contents: read
  actions: write

