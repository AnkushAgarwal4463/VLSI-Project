name: Systolic Array Congestion Sweep

on:
  workflow_dispatch:
    inputs:
      test_mode: 
        description: "Select experiment size"
        required: true
        type: choice
        default: test_1_run
        options:
          - test_1_run
          - full_72_run

permissions:
  contents: read
  actions: write

jobs:

 
  # ============================================================
  # JOB 1: GENERATE MATRIX
  # ============================================================
  generate-matrix:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      expected_runs: ${{ steps.set-matrix.outputs.expected_runs }}

    steps:
      - name: Generate configuration matrix
        id: set-matrix
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import itertools
          import sys

          # Test configurations: 6 runs
          test_configs = [
              {"ARRAY_ROWS": 2, "ARRAY_COLS": 2, "DATA_WIDTH": 4, "UTIL": 20, "CLK_PERIOD": 10},
              {"ARRAY_ROWS": 2, "ARRAY_COLS": 8, "DATA_WIDTH": 8, "UTIL": 70, "CLK_PERIOD": 15},
              {"ARRAY_ROWS": 4, "ARRAY_COLS": 2, "DATA_WIDTH": 4, "UTIL": 20, "CLK_PERIOD": 20},
              {"ARRAY_ROWS": 4, "ARRAY_COLS": 8, "DATA_WIDTH": 8, "UTIL": 70, "CLK_PERIOD": 25},
              {"ARRAY_ROWS": 8, "ARRAY_COLS": 2, "DATA_WIDTH": 4, "UTIL": 20, "CLK_PERIOD": 30},
              {"ARRAY_ROWS": 8, "ARRAY_COLS": 8, "DATA_WIDTH": 8, "UTIL": 70, "CLK_PERIOD": 35},
          ]

          # Full configurations:
          # 9 array shapes x 2 widths x 6 utilization levels x 2 clocks = 216
          shapes = [
              (2, 2), (2, 4), (2, 8),
              (4, 2), (4, 4), (4, 8),
              (8, 2), (8, 4), (8, 8),
          ]

          data_widths = [4, 8]
          utilizations = [20, 30, 40, 50, 60, 70]

          clock_periods = {
              2: [10, 15],
              4: [20, 25],
              8: [30, 35],
          }

          full_configs = []

          for rows, cols in shapes:
              for width, util, clk in itertools.product(
                  data_widths,
                  utilizations,
                  clock_periods[rows]
              ):
                  full_configs.append({
                      "ARRAY_ROWS": rows,
                      "ARRAY_COLS": cols,
                      "DATA_WIDTH": width,
                      "UTIL": util,
                      "CLK_PERIOD": clk,
                  })

          # Select the matrix using the existing workflow input.
          # Keep the input name full_72_run for compatibility.
          event = json.loads(__import__("os").environ.get("GITHUB_EVENT_PATH", "{}") and
                             open(__import__("os").environ["GITHUB_EVENT_PATH"]).read())
          selected_mode = event.get("inputs", {}).get("test_mode", "test_1_run")

          if selected_mode == "full_72_run":
              configs = full_configs
              mode = "full"
          else:
              configs = test_configs
              mode = "test"

          matrix = {"include": configs}

          print(f"matrix={json.dumps(matrix, separators=(',', ':'))}")
          print(f"expected_runs={len(configs)}")

          print(
              f"Mode: {mode}; generated {len(configs)} configurations.",
              file=sys.stderr
          )
          PY

  # ================================================================
  # JOB 2: Run Sweep
  # ================================================================
  run-sweep:

    needs: generate-matrix

    runs-on: ubuntu-latest

    timeout-minutes: 420

    strategy:
      fail-fast: false
      max-parallel: 1

      matrix:
        include: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------------
      # Cache
      # --------------------------------------------------------------
      - name: Cache Conda Toolchain
        id: cache-conda
        uses: actions/cache@v4
        with:
          path: ./conda-env
          key: ${{ runner.os }}-condapdk-v6-fmt8


      # --------------------------------------------------------------
      # Disk cleanup
      # --------------------------------------------------------------
      - name: Free up disk space
        if: steps.cache-conda.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
      # --------------------------------------------------------------
      # Toolchain
      # --------------------------------------------------------------
      - name: Install toolchain
        if: steps.cache-conda.outputs.cache-hit != 'true'
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          curl -Ls \
            https://micro.mamba.pm/api/micromamba/linux-64/latest \
            | tar -xvj bin/micromamba
          ./bin/micromamba create \
            --yes \
            --prefix ./conda-env \
            --channel https://conda.anaconda.org/litex-hub \
            --channel conda-forge \
            --channel main \
            open_pdks.sky130a \
            openroad \
            yosys \
            fmt=8
      - name: Add toolchain to PATH
        shell: bash
        run: |
          echo "$(pwd)/conda-env/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/conda-env/lib" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$(pwd)/conda-env/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      # --------------------------------------------------------------
      # Experiment variables
      # --------------------------------------------------------------
      - name: Set run environment
        shell: bash
        run: |
          set -euo pipefail
          echo "ARRAY_ROWS=${{ matrix.ARRAY_ROWS }}" >> "$GITHUB_ENV"
          echo "ARRAY_COLS=${{ matrix.ARRAY_COLS }}" >> "$GITHUB_ENV"
          echo "DATA_WIDTH=${{ matrix.DATA_WIDTH }}" >> "$GITHUB_ENV"
          echo "UTIL=${{ matrix.UTIL }}" >> "$GITHUB_ENV"
          echo "CLK_PERIOD=${{ matrix.CLK_PERIOD }}" >> "$GITHUB_ENV"
          echo "RUN_TAG=sys${{ matrix.ARRAY_ROWS }}x${{ matrix.ARRAY_COLS }}_w${{ matrix.DATA_WIDTH }}_u${{ matrix.UTIL }}_clk${{ matrix.CLK_PERIOD }}" >> "$GITHUB_ENV"
      # --------------------------------------------------------------
      # Find Liberty
      # --------------------------------------------------------------
      - name: Locate SKY130 Liberty
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching for SKY130 Liberty file..."
          LIB=$(find ./conda-env -type f \
            \( -name "sky130_fd_sc_hd__tt_025C_5v00.lib" \
               -o -name "sky130_fd_sc_hd__tt_025C_5v00.lib.gz" \
               -o -name "sky130_fd_sc_hd*.lib" \
               -o -name "sky130_fd_sc_hd*.lib.gz" \) \
            -print | head -n 1)
          if [ -z "$LIB" ]; then
            echo "ERROR: SKY130 Liberty file not found."
            echo "Available SKY130 files:"
            find ./conda-env -type f \
              | grep -i sky130 \
              | head -100 || true
            exit 1
          fi
          echo "Found Liberty:"
          echo "$LIB"
          if [[ "$LIB" == *.lib.gz ]]; then
            echo "Liberty is compressed."
            echo "Decompressing..."
            gunzip -k "$LIB"
            LIB="${LIB%.gz}"
          fi
          test -f "$LIB"
          echo "Using Liberty:"
          echo "$LIB"
          echo "LIB_FILE=$LIB" >> "$GITHUB_ENV"
      # --------------------------------------------------------------
      # Verify
      # --------------------------------------------------------------
      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "======================================"
          echo "ARRAY_ROWS = $ARRAY_ROWS"
          echo "ARRAY_COLS = $ARRAY_COLS"
          echo "DATA_WIDTH = $DATA_WIDTH"
          echo "UTIL       = $UTIL"
          echo "CLK_PERIOD = $CLK_PERIOD"
          echo "RUN_TAG    = $RUN_TAG"
          echo "LIB_FILE   = $LIB_FILE"
          echo "======================================"
          command -v yosys
          command -v openroad
          yosys -V
          openroad -version
          test -f "$LIB_FILE"
      # ================================================================
      # SYNTHESIS
      # ================================================================
      - name: Synthesize
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/mkdir -p \
            "systolic_project/synth"
          /usr/bin/mkdir -p \
            "systolic_project/runs/${RUN_TAG}"
          sed \
          -e "s|__ARRAY_ROWS__|${ARRAY_ROWS}|g" \
          -e "s|__ARRAY_COLS__|${ARRAY_COLS}|g" \
          -e "s|__DATA_WIDTH__|${DATA_WIDTH}|g" \
          -e "s|__LIB_FILE__|${LIB_FILE}|g" \
          -e "s|__RUN_TAG__|${RUN_TAG}|g" \
          scripts/synth.ys \
          > /tmp/synth.ys
          echo "Running Yosys..."
          yosys \
            -s /tmp/synth.ys \
            2>&1 | tee \
            "systolic_project/runs/${RUN_TAG}/synth_log.txt"
          test -f \
            "systolic_project/synth/systolic_netlist.v"

      - name: Check runner memory
        run: |
          echo "===== MEMORY ====="
          free -h
      
          echo "===== CPU CORES ====="
          nproc
      
          echo "===== SWAP ====="
          grep -E 'MemTotal|MemAvailable|SwapTotal|SwapFree' /proc/meminfo
      
          echo "===== CGROUP MEMORY LIMIT ====="
          cat /sys/fs/cgroup/memory.max 2>/dev/null || true
      
          echo "===== CGROUP MEMORY USAGE ====="
          cat /sys/fs/cgroup/memory.current 2>/dev/null || true
# ================================================================
# OPENROAD
# ================================================================
      - name: Run OpenROAD
        timeout-minutes: 360
        shell: bash
        run: |
          set -euo pipefail
          RUN_DIR="systolic_project/runs/${RUN_TAG}"
          openroad \
            -exit \
            scripts/flow.tcl \
            2>&1 | tee "${RUN_DIR}/openroad_log.txt"
          test -f "${RUN_DIR}/final.odb"
      - name: Debug generated reports
        shell: bash
        run: |
          set -euo pipefail
          RUN_DIR="systolic_project/runs/${RUN_TAG}"
          echo "========================================"
          echo "RUN DIRECTORY"
          echo "========================================"
          find "$RUN_DIR" \
            -type f \
            -print | sort
          echo
          echo "========================================"
          echo "FILE SIZES"
          echo "========================================"
          find "$RUN_DIR" \
            -type f \
            -printf '%s bytes  %p\n' | sort
          echo
          echo "========================================"
          echo "OPENROAD LOG - LAST 150 LINES"
          echo "========================================"
          if [ -f "${RUN_DIR}/openroad_log.txt" ]; then
            tail -150 "${RUN_DIR}/openroad_log.txt"
          else
            echo "openroad_log.txt NOT FOUND"
          fi
          echo
          echo "========================================"
          echo "REPORT FILES"
          echo "========================================"
          find "$RUN_DIR" \
            -type f \
            \( -name "*.rpt" -o -name "*.report" \) \
            -print | sort
            
      - name: Inspect generated reports
        shell: bash
        run: |
          set -euo pipefail
          RUN_DIR="systolic_project/runs/${RUN_TAG}"
      
          echo "=================================================="
          echo "GENERATED FILES"
          echo "=================================================="
          find "$RUN_DIR" -maxdepth 1 -type f -printf '%f\n' | sort

          for f in \
            design_area.rpt \
            placement_area.rpt \
            cell_usage.rpt \
            wirelength_detailed.rpt \
            wirelength_final.rpt \
            congestion.rpt \
            route_status_final.rpt \
            timing_setup.rpt \
            timing_hold.rpt \
            wns_setup.rpt \
            tns_setup.rpt \
            wns_hold.rpt \
            tns_hold.rpt
          do
            echo
            echo "=================================================="
            echo "$f"
            echo "=================================================="

            if [ -f "$RUN_DIR/$f" ]; then
              cat "$RUN_DIR/$f"
            else
              echo "FILE NOT FOUND"
            fi
          done
      - name: Debug routing artifacts
        shell: bash
        run: |
          echo "=============================================="
          echo "ROUTING FILE CHECK"
          echo "=============================================="
      
          echo "Current directory:"
          pwd
      
          echo ""
          echo "Run directory:"
          ls -lah "systolic_project/runs/${RUN_TAG}" || true
      
          echo ""
          echo "Searching entire workspace:"
          find . -type f \( \
            -name "wirelength_detailed.rpt" -o \
            -name "wirelength_final.rpt" -o \
            -name "congestion.rpt" -o \
            -name "route_status_final.rpt" \
          \) -print
          
          echo "=============================================="
          echo "=============================================="
          echo "GLOBAL ROUTE REPORT"
          echo "=============================================="
          
          if [ -f "systolic_project/runs/${RUN_TAG}/global_route.rpt" ]; then
            cat "systolic_project/runs/${RUN_TAG}/global_route.rpt"
          else
            echo "global_route.rpt NOT FOUND"
          fi
          
          echo ""
          echo "=============================================="
          echo "ROUTE STATUS"
          echo "=============================================="
          
          if [ -f "systolic_project/runs/${RUN_TAG}/route_status_final.rpt" ]; then
            cat "systolic_project/runs/${RUN_TAG}/route_status_final.rpt"
          else
            echo "route_status_final.rpt NOT FOUND"
          fi
      # ================================================================
      # FEATURE EXTRACTION
      # ================================================================
      - name: Extract 17 features
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/extract_features.py
          test -f \
            "systolic_project/runs/${RUN_TAG}/features.json"
      - name: Show extracted features
        shell: bash
        run: |
          echo "========================================"
          echo "FEATURES.JSON"
          echo "========================================"
          cat "systolic_project/runs/${RUN_TAG}/features.json"
      # ================================================================
      # UPLOAD
      # ================================================================
      - name: Upload run results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ env.RUN_TAG }}
          path: |
            systolic_project/runs/${{ env.RUN_TAG }}/
            systolic_project/synth/systolic_netlist.v
          if-no-files-found: warn


      # ================================================================
      # SUMMARY
      # ================================================================
      - name: Run summary
        if: always()
        shell: bash
        run: |
          echo "### Run Summary: ${RUN_TAG}" \
            >> "$GITHUB_STEP_SUMMARY"
          if [ -f \
            "systolic_project/runs/${RUN_TAG}/final.odb"
          ]; then
            echo "- final.odb: YES" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- final.odb: NO" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f \
            "systolic_project/runs/${RUN_TAG}/features.json"
          ]; then
            echo "- 17-feature JSON: YES" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 17-feature JSON: NO" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
   # ================================================================
  # JOB 3: Aggregate
  # ================================================================
  aggregate-results:

    needs: run-sweep

    runs-on: ubuntu-latest

    if: always()

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------------
      # Download all run artifacts
      # --------------------------------------------------------------
      - name: Download all result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: downloaded_artifacts
          merge-multiple: true


      # --------------------------------------------------------------
      # Show downloaded files
      # --------------------------------------------------------------
      - name: Show downloaded files
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "DOWNLOADED RUN ARTIFACTS"
          echo "=============================================================="

          find downloaded_artifacts \
            -type f \
            -print \
            | sort

          echo
          echo "=============================================================="
          echo "FEATURE JSON FILES"
          echo "=============================================================="

          find downloaded_artifacts \
            -type f \
            -name "features.json" \
            -print \
            | sort


      # --------------------------------------------------------------
      # Generate CSV directly from features.json
      # --------------------------------------------------------------
      - name: Generate dataset CSV
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p summary_output

          python3 <<'PY'
          import json
          import csv
          import re
          from pathlib import Path

          ROOT = Path("downloaded_artifacts")
          OUTPUT = Path("summary_output/systolic_array_sweep_dataset.csv")

          COLUMNS = [
              "array_rows",
              "array_cols",
              "data_width",
              "utilization",
              "clock_period",
              "max_density",
              "mean_density",
              "std_density",
              "pin_density",
              "avg_fanout",
              "max_fanout",
              "x_spread",
              "y_spread",
              "num_registers",
              "logic_depth",
              "crit_path_wirelength",
              "estimated_wirelength",
              "congestion",
              "WNS",
              "TNS"
          ]

          print("=" * 70)
          print("SYSTOLIC ARRAY ML DATASET AGGREGATION")
          print("=" * 70)
          print()
          print(f"Artifact directory : {ROOT}")
          print(f"Output CSV         : {OUTPUT}")
          print()

          if not ROOT.exists():
              print("[ERROR] downloaded_artifacts does not exist.")
              raise SystemExit(1)

          feature_files = sorted(ROOT.rglob("features.json"))

          print(f"features.json files found: {len(feature_files)}")
          print()

          if not feature_files:
              print("[ERROR] No features.json files found.")
              print()
              print("Files downloaded:")
              for p in sorted(ROOT.rglob("*")):
                  if p.is_file():
                      print(f"  {p}")
              raise SystemExit(1)

          rows = []

          for feature_file in feature_files:

              print(f"Reading: {feature_file}")

              try:
                  with feature_file.open(
                      "r",
                      encoding="utf-8"
                  ) as f:
                      data = json.load(f)

              except Exception as e:
                  print(f"  [WARNING] JSON read failed: {e}")
                  continue

              if not isinstance(data, dict):
                  print("  [WARNING] JSON root is not an object.")
                  continue

              row = {}

              # ------------------------------------------------------
              # Copy the 19 expected fields
              # ------------------------------------------------------

              for column in COLUMNS:
                  row[column] = data.get(column)

              # ------------------------------------------------------
              # Recover experiment parameters from rectangular run_tag
              # Example: sys2x4_w4_u20_clk10
              # ------------------------------------------------------

              run_tag = data.get("run_tag")

              if run_tag:
                  match = re.search(
                      r"sys(\d+)x(\d+)_w(\d+)_u(\d+)_clk([0-9.]+)",
                      str(run_tag)
                  )

                  if match:
                      row["array_rows"] = int(match.group(1))
                      row["array_cols"] = int(match.group(2))
                      row["data_width"] = int(match.group(3))
                      row["utilization"] = int(match.group(4))
                      row["clock_period"] = float(match.group(5))

              # ------------------------------------------------------
              # Alternative names
              # ------------------------------------------------------

              if row["clock_period"] is None:
                  row["clock_period"] = data.get("clk_period")

              if row["utilization"] is None:
                  row["utilization"] = data.get("util")

              # ------------------------------------------------------
              # Store row
              # ------------------------------------------------------

              rows.append(row)

              print("  [OK]")

          # ----------------------------------------------------------
          # Write CSV
          # ----------------------------------------------------------

          OUTPUT.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          with OUTPUT.open(
              "w",
              encoding="utf-8",
              newline=""
          ) as f:

              writer = csv.DictWriter(
                  f,
                  fieldnames=COLUMNS,
                  extrasaction="ignore"
              )

              writer.writeheader()
              writer.writerows(rows)

          print()
          print("=" * 70)
          print("CSV CREATED")
          print("=" * 70)
          print(f"Output : {OUTPUT}")
          print(f"Rows   : {len(rows)}")
          print(f"Columns: {len(COLUMNS)}")
          print()

          if len(rows) == 6:
              print("[OK] Test run: 6 rows generated.")

          elif len(rows) == 216:
              print("[OK] Full sweep: 216 rows generated.")

          else:
              print(
                  f"[WARNING] {len(rows)} rows generated."
              )

          print()
          print("CSV header:")
          print(",".join(COLUMNS))

          if len(rows) == 0:
              print()
              print("[ERROR] CSV contains zero rows.")
              raise SystemExit(1)
          PY


      # --------------------------------------------------------------
      # Verify CSV
      # --------------------------------------------------------------
      - name: Verify CSV
        shell: bash
        run: |
          set -euo pipefail

          CSV="summary_output/systolic_array_sweep_dataset.csv"

          echo "=============================================================="
          echo "DATASET VERIFICATION"
          echo "=============================================================="

          test -f "$CSV"

          echo
          echo "CSV file:"
          ls -lh "$CSV"

          echo
          echo "CSV preview:"
          head -n 5 "$CSV"

          echo
          ROWS=$(tail -n +2 "$CSV" | wc -l)

          echo "Rows generated: $ROWS"

          if [ "$ROWS" -eq 0 ]; then
            echo "[ERROR] Dataset contains zero rows."
            exit 1
          fi


      # --------------------------------------------------------------
      # Verify 20-column schema
      # --------------------------------------------------------------
      - name: Verify 20-column schema
        shell: bash
        run: |
          set -euo pipefail

          CSV="summary_output/systolic_array_sweep_dataset.csv"

          EXPECTED="array_rows,array_cols,data_width,utilization,clock_period,max_density,mean_density,std_density,pin_density,avg_fanout,max_fanout,x_spread,y_spread,num_registers,logic_depth,crit_path_wirelength,estimated_wirelength,congestion,WNS,TNS"
          ACTUAL=$(head -n 1 "$CSV" | tr -d '\r')

          echo "Actual:"
          echo "$ACTUAL"

          echo
          echo "Expected:"
          echo "$EXPECTED"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo
              echo "[ERROR] CSV does not contain the expected 20 columns."
              exit 1
          fi

          echo
          echo "[OK] 20-column schema verified successfully."


      # --------------------------------------------------------------
      # Upload final CSV
      # --------------------------------------------------------------
      - name: Upload Aggregated CSV Dataset
        uses: actions/upload-artifact@v4
        with:
          name: full-sweep-dataset-csv
          path: summary_output/systolic_array_sweep_dataset.csv
          if-no-files-found: error


      # --------------------------------------------------------------
      # Summary
      # --------------------------------------------------------------
      - name: Aggregate summary
        if: always()
        shell: bash
        run: |
          echo "### Aggregate Dataset Summary" \
            >> "$GITHUB_STEP_SUMMARY"

          CSV="summary_output/systolic_array_sweep_dataset.csv"

          if [ -f "$CSV" ]; then

            COUNT=$(tail -n +2 "$CSV" | wc -l)

            echo "- Dataset generated: YES" \
              >> "$GITHUB_STEP_SUMMARY"

            echo "- Run entries: $COUNT" \
              >> "$GITHUB_STEP_SUMMARY"

            echo "- Expected full sweep: 216" \
              >> "$GITHUB_STEP_SUMMARY"

          else

            echo "- Dataset generated: NO" \
              >> "$GITHUB_STEP_SUMMARY"

          fi
